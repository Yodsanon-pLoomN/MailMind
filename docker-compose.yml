version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_USER=mailmind_user
      - POSTGRES_PASSWORD=mailmind_password
      - POSTGRES_DB=mailmind_db
    ports:
      - "5432:5432"
    volumes:
      - mailmind_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailmind_user -d mailmind_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailmind:
    image: n8nio/n8n:latest
    restart: always
    ports:
      - "5678:5678"
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=db
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=mailmind_db
      - DB_POSTGRESDB_USER=mailmind_user
      - DB_POSTGRESDB_PASSWORD=mailmind_password
      - N8N_ENCRYPTION_KEY=mailmind_secret_key_123 # อย่าลืมเปลี่ยนเป็นรหัสสุ่มที่มีความปลอดภัยสูง
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - mailmind_data:/home/node/.n8n

volumes:
  mailmind_db_data:
  mailmind_data: