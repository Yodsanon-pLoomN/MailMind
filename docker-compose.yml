version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_USER=mailmind_user
      - POSTGRES_PASSWORD=mailmind_password
      - POSTGRES_DB=mailmind_db
    ports:
      - "5432:5432"
    volumes:
      - mailmind_db_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailmind_user -d mailmind_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  n8n: # เปลี่ยนชื่อจาก mailmind เป็น n8n ให้ไม่งง
    image: n8nio/n8n:latest
    restart: always
    ports:
      - "5678:5678"
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=db
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n_db
      - DB_POSTGRESDB_USER=mailmind_user
      - DB_POSTGRESDB_PASSWORD=mailmind_password
      - N8N_ENCRYPTION_KEY=mailmind_secret_key_123 
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - n8n_data:/home/node/.n8n

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: always
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  mailmind_db_data:
  n8n_data:
  pgadmin_data: